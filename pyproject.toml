[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lqtmoment"
dynamic = ["version"]
description = "Compute seismic moment in LQT systems with advanced spectral fitting"
readme = "README.md"
authors = [{name = "Arham Zakki Edelo", email = "edelo.arham@gmail.com"}]
license-files = ["LICENSE"]
keywords = ["Seismology", "Moment Magnitude", "Spectral Fitting", "LQT Component", "Earthquake", "Geophysics"]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "scipy>=1.5.0",
    "scikit-optimize>=0.10.0",
    "obspy>=1.3.0",
    "tqdm>=4.60.0",
    "configparser>=5.0.0",
    "openpyxl>=3.0.0",
    "plotly>=5.20.0"
]
optional-dependencies.testing = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Natural Language :: English"
]

[project.urls]
Homepage = "https://github.com/bgjx/lqt-moment-magnitude"
Repository = "https://github.com/bgjx/lqt-moment-magnitude"
Documentation = "https://bgjx.io/lqtmoment"
BugTracker = "https://github.com/bgjx/lqt-moment-magnitude/issues"

[project.scripts]
lqtmoment = "lqtmoment.main:main"
lqtcatalog = "lqtmoment.catalog_builder:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lqtmoment"]

[tool.uv]
# the devcontainer bind-mounts the project dir over a different filesystem than
# uv's cache, so hardlinking/reflinking across that boundary isn't reliable
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lqtmoment --cov-report=term-missing"

[tool.ruff]
target-version = "py39"