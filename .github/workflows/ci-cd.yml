name: CI/CD - Test and Publish lqtmoment

on:
  push:
    branches: [ "**" ]
    tags: ["v*.*.*"]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
      name: Check out repository
      with:
        fetch-depth: 0  # hatch-vcs needs full history/tags to derive the version

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[testing]"
        pip install build

    - name: Run tests
      run: |
        pytest

  publish-pypi:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: Check out repository
        with:
          fetch-depth: 0  # hatch-vcs needs full history/tags to derive the version
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.12"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          python -m build
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* -u __token__ -p $TWINE_PASSWORD
  
  publish-conda:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Check out repository
        with:
          fetch-depth: 0  # conda-build's GIT_DESCRIBE_TAG needs full history/tags too
      
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          channels: conda-forge,defaults
      
      - name: install conda-build and anaconda-client
        run: conda install conda-build anaconda-client
      
      - name: Build Conda package
        run: conda-build conda-recipe/
      
      - name: Upload to Anaconda Cloud
        env: 
          ANACONDA_TOKEN: ${{ secrets.CONDA_API_TOKEN }}
        run: |
          anaconda login --token $ANACONDA_TOKEN
          anaconda upload $(conda-build conda-recipe/ --output | grep -E '.*\.conda$')

          